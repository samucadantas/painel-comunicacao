name: Atualizar painel

on:
  schedule:
    # De 3 em 3 horas, aos 23 minutos.
    #
    # Era uma vez por dia às 11:00 UTC e o painel amanhecia velho: o agendamento do
    # GitHub é "melhor esforço" e, na hora cheia (que é quando todo mundo agenda), a
    # fila atrasou de 18 minutos a 10 horas — 20:50, 21:16, 15:06 em dias seguidos.
    #
    # Não dá para deixar de atrasar, então tira-se a aposta numa hora só: com 8 tentativas
    # por dia, sempre há uma recente. Aos :23 para fugir do congestionamento da hora cheia.
    # Em repositório público os minutos de Actions são gratuitos e ilimitados.
    - cron: "23 */3 * * *"
  workflow_dispatch:      # permite rodar na mão pelo site do GitHub
  push:
    branches: [main]

# Só uma publicação por vez, e sem cancelar a que já começou: se duas rodadas se
# cruzarem, a segunda espera em vez de deixar o site pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # para commitar o painel gerado
      pages: write        # para publicar no GitHub Pages
      id-token: write     # exigido pelo deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O runner não traz sips (que só existe no Mac) nem ImageMagick. Sem um redutor,
      # o sync descarta as miniaturas do Instagram, que vêm em 720px/66 KB, e o painel
      # sai sem as fotos das publicações em destaque.
      - name: Instalar o redutor de miniaturas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Ler Notion + YouTube e gerar o painel
        env:
          # Credenciais ficam em Secrets; identificadores de base, em Variables —
          # o repositório é público e nenhum dos dois pode viver dentro do código.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GENNA_API_KEY: ${{ secrets.GENNA_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          DB_ID: ${{ vars.DB_ID }}
          DB_SOLICITANTES: ${{ vars.DB_SOLICITANTES }}
          DB_MINISTERIOS: ${{ vars.DB_MINISTERIOS }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_HANDLE: ${{ vars.YT_HANDLE }}
          GENNA_BRAND_ID: ${{ vars.GENNA_BRAND_ID }}
        run: |
          node sync.mjs
          node build.mjs

      - name: Guardar o resultado
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add data Painel.html publicar
          git diff --staged --quiet || git commit -m "Painel atualizado em $(TZ=America/Recife date '+%d/%m/%Y %H:%M')"
          git push

      # ---- publicação no GitHub Pages ----
      # Publica a pasta publicar/ direto, sem depender de outro serviço olhar o
      # repositório e reagir. Se esta etapa passar, o site está no ar; não existe
      # o caso "commit foi, site não" que travou o painel por cinco dias.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
