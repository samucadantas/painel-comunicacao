<style>
  :root{
    --lime:#C8F135; --lime-deep:#A9D426;
    --bg:#F1F0EA; --surface:#FFFFFF; --surface-2:#F7F7F3;
    --deep:#16281C; --deep-2:#1E3626;
    --ink:#13201A; --ink-on-deep:#EEF5EA;
    --muted:#6C7A70; --muted-2:#93A197;
    --line:rgba(19,32,26,.10);
    --warn:#E8703A; --warn-soft:#FBE7DC;
    --ok:#2F8F5B;
    --radius:26px; --radius-sm:18px;
    --shadow:0 1px 2px rgba(19,32,26,.05), 0 10px 30px -12px rgba(19,32,26,.18);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1310; --surface:#171F19; --surface-2:#1D261F;
      --deep:#C8F135; --deep-2:#B7E22C;
      --ink:#E9F0E9; --ink-on-deep:#12200F;
      --muted:#93A197; --muted-2:#75837A;
      --line:rgba(233,240,233,.11);
      --warn:#F58A56; --warn-soft:#33241C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1310; --surface:#171F19; --surface-2:#1D261F;
    --deep:#C8F135; --deep-2:#B7E22C;
    --ink:#E9F0E9; --ink-on-deep:#12200F;
    --muted:#93A197; --muted-2:#75837A;
    --line:rgba(233,240,233,.11);
    --warn:#F58A56; --warn-soft:#33241C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --bg:#F1F0EA; --surface:#FFFFFF; --surface-2:#F7F7F3;
    --deep:#16281C; --deep-2:#1E3626;
    --ink:#13201A; --ink-on-deep:#EEF5EA;
    --muted:#6C7A70; --muted-2:#93A197;
    --line:rgba(19,32,26,.10);
    --warn:#E8703A; --warn-soft:#FBE7DC;
    --shadow:0 1px 2px rgba(19,32,26,.05), 0 10px 30px -12px rgba(19,32,26,.18);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:1180px;margin:0 auto}

  /* ---------- topo ---------- */
  .top{display:flex;align-items:center;gap:12px;padding:6px 4px 20px}
  .mark{width:36px;height:36px;flex:none;display:block}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand span{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
  .top .sp{flex:1}
  .ghost{
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;display:inline-flex;align-items:center;gap:7px;
  }
  .ghost:hover{color:var(--ink)}

  /* ---------- cabeçalho ---------- */
  h1{font-size:clamp(30px,8vw,46px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:0 0 8px}
  .lead{color:var(--muted);font-size:15px;margin:0 0 18px;max-width:62ch}
  .lead b{color:var(--ink);font-weight:650}

  .months{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:none}
  .months::-webkit-scrollbar{display:none}
  .months button{
    flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:10px 16px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;
    transition:background .15s, color .15s, border-color .15s;
  }
  .months button[aria-pressed="true"]{background:var(--lime);color:#13201A;border-color:transparent}

  /* ---------- bento ---------- */
  .bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
  @media(min-width:760px){.bento{grid-template-columns:repeat(4,1fr);gap:14px}}
  .tile{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:132px;
  }
  @media(min-width:760px){.tile{padding:22px;min-height:158px}}
  .tile.big{grid-column:span 2}
  @media(min-width:760px){.tile.big{grid-column:span 2}}
  .tile.lime{background:var(--lime);border-color:transparent;color:#13201A}
  .tile.deep{background:var(--deep);border-color:transparent;color:var(--ink-on-deep)}
  .k{font-size:12.5px;font-weight:650;letter-spacing:.01em;opacity:.68;margin-bottom:auto}
  .tile.lime .k,.tile.deep .k{opacity:.72}
  .v{font-size:clamp(38px,11vw,58px);line-height:1;font-weight:800;letter-spacing:-.045em;margin-top:14px}
  .tile.big .v{font-size:clamp(52px,17vw,86px)}
  .u{font-size:13px;font-weight:600;opacity:.62;margin-top:7px}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;margin-top:9px;
    padding:3px 9px;border-radius:999px;background:rgba(19,32,26,.08)}
  .tile.deep .delta{background:rgba(238,245,234,.14)}
  :root[data-theme="dark"] .tile:not(.lime):not(.deep) .delta{background:rgba(233,240,233,.09)}

  /* ---------- cartões ---------- */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;box-shadow:var(--shadow);margin-bottom:12px;
  }
  @media(min-width:760px){.card{padding:24px 26px;margin-bottom:14px}}
  h2{font-size:17px;font-weight:750;letter-spacing:-.02em;margin:0 0 3px}
  .hint{font-size:13px;color:var(--muted);margin:0 0 18px}
  .cols{display:grid;gap:12px}
  @media(min-width:860px){.cols{grid-template-columns:1fr 1fr;gap:14px}.cols>.card{margin-bottom:0}}

  /* ---------- barras horizontais ---------- */
  .rows{display:flex;flex-direction:column;gap:11px}
  .r{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;align-items:center;gap:12px}
  .r .nm{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* no celular o nome ganha a linha inteira em vez de ser cortado */
  @media(max-width:620px){
    .r{grid-template-columns:1fr auto;grid-template-areas:"nm n" "bar bar";gap:5px 10px}
    .r .nm{grid-area:nm;white-space:normal;overflow:visible}
    .r .track{grid-area:bar}
    .r .n{grid-area:n}
  }
  .track{height:11px;border-radius:999px;background:var(--surface-2);overflow:hidden}
  :root[data-theme="dark"] .track{background:rgba(233,240,233,.08)}
  @media (prefers-color-scheme: dark){.track{background:rgba(233,240,233,.08)}}
  .fill{height:100%;border-radius:999px;background:var(--lime);min-width:5px}
  .fill.soft{background:var(--lime-deep);opacity:.6}
  :root[data-theme="dark"] .fill.soft{opacity:.8}
  @media (prefers-color-scheme: dark){.fill.soft{opacity:.8}}
  .r .n{font-size:13.5px;font-weight:750;font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}

  /* ---------- histórico ---------- */
  .chart{display:flex;align-items:flex-end;gap:clamp(8px,3vw,22px);height:190px;padding-top:8px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
  .bar{width:100%;max-width:74px;border-radius:12px 12px 6px 6px;background:var(--lime);position:relative;transition:height .5s cubic-bezier(.22,1,.36,1)}
  .bar.dim{background:var(--surface-2);border:1px dashed var(--line)}
  :root[data-theme="dark"] .bar.dim{background:rgba(233,240,233,.07)}
  .bar b{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:13px;font-weight:750;color:var(--ink)}
  .col .lb{font-size:11.5px;font-weight:650;color:var(--muted);white-space:nowrap}
  .col .lb.on{color:var(--ink)}

  /* ---------- pipeline ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:600;background:var(--surface-2)}
  .chip b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}

  /* ---------- listas ---------- */
  .list{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .item{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;
    padding:13px 15px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid transparent}
  .item.late{background:var(--warn-soft);border-color:rgba(232,112,58,.22)}
  .item .t{font-size:14px;font-weight:650;line-height:1.3}
  .item .m{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .tag{font-size:11.5px;font-weight:750;padding:4px 10px;border-radius:999px;background:rgba(19,32,26,.07);white-space:nowrap}
  :root[data-theme="dark"] .tag{background:rgba(233,240,233,.1)}
  @media (prefers-color-scheme: dark){.tag{background:rgba(233,240,233,.1)}}
  .tag.red{background:var(--warn);color:#fff}
  .empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface-2);border-radius:var(--radius-sm)}

  /* ---------- redes ---------- */
  .net{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
  .nc{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 15px;background:var(--surface-2)}
  .nc .h{font-size:12.5px;font-weight:650;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nc .p{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:5px}
  .nc.zero .p{color:var(--muted-2)}

  .foot{color:var(--muted);font-size:12.5px;line-height:1.6;padding:14px 6px 0}
  .foot b{color:var(--ink);font-weight:650}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

    <div class="list" id="atrasadas"></div>

    <div style="height:22px"></div>
    <h2 style="font-size:15px">Próximos prazos (14 dias)</h2>
    <div class="list" id="proximas"></div>
  </section>

  <div class="cols">
    <section class="card">
      <h2>Instagram</h2>
      <p class="hint" id="ig-hint"></p>
      <div class="net" id="instagram"></div>
    </section>

    <section class="card">
      <h2>YouTube</h2>
      <p class="hint" id="yt-hint"></p>
      <div class="net" id="youtube"></div>
    </section>
  </div>

  <section class="card">
    <h2>Quem mais pediu</h2>
    <p class="hint" id="sol-hint"></p>
    <div class="rows" id="solicitantes"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

const MESES_EXT = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const $ = (id) => document.getElementById(id);
const nf = (n) => new Intl.NumberFormat("pt-BR").format(n);
const dias = (n) => (n === 1 ? "1 dia" : nf(n) + " dias");
const dataBR = (iso) => { const [a,m,d] = iso.split("-"); return `${d}/${m}`; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------- tema ---------- */
const root = document.documentElement;
const savedTheme = (() => { try { return localStorage.getItem("painel-tema"); } catch { return null; } })();
if (savedTheme) root.dataset.theme = savedTheme;
function pintaBotao(){
  const escuro = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  $("theme-ico").textContent = escuro ? "☀" : "☾";
  $("theme-lbl").textContent = escuro ? "Claro" : "Escuro";
}
$("theme").addEventListener("click", () => {
  const escuro = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = escuro ? "light" : "dark";
  try { localStorage.setItem("painel-tema", root.dataset.theme); } catch {}
  pintaBotao();
});
pintaBotao();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", pintaBotao);

/* ---------- barras ---------- */
function barras(el, itens, { soft = false, sufixo = "" } = {}) {
  if (!itens.length) { el.innerHTML = '<div class="empty">Nada registrado neste mês.</div>'; return; }
  const max = Math.max(...itens.map((i) => i.total)) || 1;
  el.innerHTML = itens.map((i) => `
    <div class="r">
      <div class="nm" title="${esc(i.nome)}">${esc(i.nome)}</div>
      <div class="track"><div class="fill${soft ? " soft" : ""}" style="width:${Math.max((i.total / max) * 100, 4)}%"></div></div>
      <div class="n">${nf(i.total)}${sufixo}</div>
    </div>`).join("");
}

/* ---------- render ---------- */
let mesAtivo = D.meses[0].month;

function render(month) {
  mesAtivo = month;
  const i = D.meses.findIndex((m) => m.month === month);
  const m = D.meses[i];
  const ant = D.meses[i + 1] || null;
  const nomeMes = MESES_EXT[+m.month.slice(5, 7) - 1];

  /* botões de mês */
  $("months").innerHTML = D.meses.map((x) =>
    `<button type="button" data-m="${x.month}" aria-pressed="${x.month === month}">${x.label}</button>`
  ).join("");

  /* chamada */
  const diaHoje = +D.hoje.slice(8, 10);
  $("lead").innerHTML = m.parcial
    ? `Mês em andamento: <b>${diaHoje} ${diaHoje === 1 ? "dia" : "dias"}</b> de ${nomeMes}. Os números de ${nomeMes} ainda vão crescer até o fim do mês — compare com o ritmo dos meses fechados abaixo.`
    : `Retrato fechado de <b>${nomeMes}</b>. Os dados vêm direto do Notion e são atualizados todo dia.`;

  /* KPIs */
  const delta = (atual, anterior) => {
    if (!anterior || m.parcial) return "";
    const d = atual - anterior;
    if (!d) return `<span class="delta">igual ao mês anterior</span>`;
    return `<span class="delta">${d > 0 ? "▲" : "▼"} ${nf(Math.abs(d))} vs ${ant.label.split(" ")[0]}</span>`;
  };
  const ritmoDia = m.parcial && diaHoje ? (m.finalizadas / diaHoje) : null;

  $("kpis").innerHTML = `
    <div class="tile lime big">
      <div class="k">Entregas ${m.parcial ? "até agora" : "no mês"}</div>
      <div class="v">${nf(m.finalizadas)}</div>
      <div class="u">${m.parcial && ritmoDia ? `≈ ${ritmoDia.toFixed(1)} por dia · projeção de ${Math.round(ritmoDia * 30)} no mês` : `${nf(m.criadas)} novos pedidos entraram`}</div>
      ${delta(m.finalizadas, ant && ant.finalizadas)}
    </div>
    <div class="tile deep">
      <div class="k">Tempo médio de entrega</div>
      <div class="v">${String(m.tempo_medio).replace(".", ",")}</div>
      <div class="u">dias · metade sai em até ${dias(m.tempo_mediana)}</div>
    </div>
    <div class="tile">
      <div class="k">Pedidos novos</div>
      <div class="v">${nf(m.criadas)}</div>
      <div class="u">abertos ${m.parcial ? "neste mês" : "em " + nomeMes}</div>
      ${delta(m.criadas, ant && ant.criadas)}
    </div>
    <div class="tile">
      <div class="k">Na fila hoje</div>
      <div class="v">${nf(D.agora.em_aberto)}</div>
      <div class="u">${D.agora.atrasadas_total ? `${D.agora.atrasadas_total} passaram do prazo` : "nenhuma atrasada"}</div>
    </div>
    <div class="tile">
      <div class="k">Posts no Instagram</div>
      <div class="v">${m.instagram ? nf(m.instagram.total) : "—"}</div>
      <div class="u">${m.instagram ? `${m.instagram.ativos} de ${D.social.instagram ? D.social.instagram.perfis.length : 7} perfis publicaram` : "sem contagem deste mês"}</div>
    </div>`;

  /* histórico */
  const hist = [...D.meses].reverse();
  const maxH = Math.max(...hist.map((x) => x.finalizadas)) || 1;
  $("chart").innerHTML = hist.map((x) => {
    const h = Math.max((x.finalizadas / maxH) * 150, 6);
    return `<div class="col">
      <div class="bar${x.parcial ? " dim" : ""}" style="height:${h}px"><b>${nf(x.finalizadas)}</b></div>
      <div class="lb${x.month === month ? " on" : ""}">${x.curto}${x.parcial ? "*" : ""}</div>
    </div>`;
  }).join("");
  const fechados = hist.filter((x) => !x.parcial);
  const mediaFech = fechados.length ? Math.round(fechados.reduce((s, x) => s + x.finalizadas, 0) / fechados.length) : 0;
  $("ritmo-hint").innerHTML = `Demandas entregues por mês. Média dos meses fechados: <b>${nf(mediaFech)}</b>.${hist.some((x) => x.parcial) ? " O mês marcado com * ainda está correndo." : ""}`;

  /* ministérios */
  barras($("ministerios"), m.ministerios);
  $("min-hint").innerHTML = `Ministérios que abriram pedidos ${m.parcial ? "neste mês" : "em " + nomeMes}. No ano, <b>${esc(D.ministerios_ano[0].nome)}</b> lidera com ${nf(D.ministerios_ano[0].total)} pedidos.`;

  /* categorias */
  const c = m.categorias;
  barras($("categorias"), [
    { nome: "Audiovisual", total: c.audiovisual },
    { nome: "Social media", total: c.social },
    { nome: "Identidade visual", total: c.identidade },
    { nome: "Impressos", total: c.impressos },
  ].filter((x) => x.total > 0).sort((a, b) => b.total - a.total));
  $("cat-hint").textContent = `Entre as ${nf(m.finalizadas)} entregas do mês (uma demanda pode contar em mais de uma frente).`;

  $("tipos").innerHTML = m.tipos.length
    ? m.tipos.map((t) => `<span class="chip">${esc(t.nome)} <b>${nf(t.total)}</b></span>`).join("")
    : '<div class="empty">Sem tipos registrados.</div>';

  /* solicitantes */
  barras($("solicitantes"), m.solicitantes, { soft: true });
  $("sol-hint").innerHTML = m.solicitantes.length
    ? `Ranking parcial: só <b>${m.cobertura_solicitante}%</b> dos pedidos do mês têm o solicitante preenchido (${nf(m.solicitantes_preenchidos)} de ${nf(m.criadas)}). O ranking por ministério acima é o retrato mais fiel.`
    : "Nenhum pedido deste mês tem o campo de solicitante preenchido.";

  /* youtube */
  const yt = D.social.youtube;
  if (yt && m.youtube) {
    const maisVisto = [...(m.youtube.novos || [])].sort((a, b) => b.views - a.views)[0];
    $("yt-hint").innerHTML = `Canal <b>${esc(yt.canal.replace(/\s*\(.*\)$/, ""))}</b> ${m.parcial ? "· até agora" : "· em " + nomeMes}.`;
    $("youtube").innerHTML = `
      <div class="nc"><div class="h">Vídeos publicados</div><div class="p">${nf(m.youtube.videos)}</div></div>
      <div class="nc"><div class="h">Visualizações</div><div class="p">${nf(m.youtube.views)}</div></div>
      ${yt.inscritos ? `<div class="nc"><div class="h">Inscritos</div><div class="p">${nf(yt.inscritos)}</div></div>` : ""}
      ${maisVisto ? `<div class="nc" style="grid-column:1/-1"><div class="h">Mais visto do mês</div><div class="p" style="font-size:15px;line-height:1.35;margin-top:6px">${esc(maisVisto.titulo)}</div><div class="h" style="margin-top:6px">${nf(maisVisto.views)} visualizações</div></div>` : ""}`;
  } else if (yt) {
    $("yt-hint").innerHTML = `Canal <b>${esc(yt.canal.replace(/\s*\(.*\)$/, ""))}</b>.`;
    $("youtube").innerHTML = '<div class="empty">O feed do YouTube cobre os 15 vídeos mais recentes — este mês já saiu dessa janela.</div>';
  } else {
    $("yt-hint").textContent = "Canal não encontrado.";
    $("youtube").innerHTML = '<div class="empty">Não foi possível ler o canal nesta atualização.</div>';
  }

  /* instagram */
  if (m.instagram) {
    $("ig-hint").innerHTML = `<b>${nf(m.instagram.total)}</b> publicações no feed ${m.parcial ? "até agora" : "em " + nomeMes}, somando todos os perfis.`;
    $("instagram").innerHTML = m.instagram.perfis.map((p) =>
      `<div class="nc${p.posts ? "" : " zero"}"><div class="h">${esc(p.handle)}</div><div class="p">${nf(p.posts)}</div></div>`
    ).join("");
  } else {
    $("ig-hint").textContent = "Ainda não há contagem de posts para este mês.";
    $("instagram").innerHTML = '<div class="empty">Sem dados de Instagram neste mês.</div>';
  }
}

/* fila (não muda com o mês — é a foto de hoje) */
$("fila-hint").innerHTML = `<b>${nf(D.agora.em_aberto)}</b> demandas abertas neste momento · <b>${nf(D.agora.ultimos30.finalizadas)}</b> entregues nos últimos 30 dias.`;
$("pipeline").innerHTML = D.agora.pipeline.map((p) => `<span class="chip">${esc(p.nome)} <b>${nf(p.total)}</b></span>`).join("");

$("atrasadas").innerHTML = D.agora.atrasadas.length
  ? D.agora.atrasadas.map((a) => `
    <div class="item late">
      <div>
        <div class="t">${esc(a.nome)}</div>
        <div class="m"><span>prazo ${dataBR(a.prazo)}</span><span>${esc(a.status)}</span>${a.ministerio ? `<span>${esc(a.ministerio)}</span>` : ""}</div>
      </div>
      <span class="tag red">${a.dias}d</span>
    </div>`).join("")
  : '<div class="empty">Nenhuma demanda passou do prazo. 🎉</div>';

$("proximas").innerHTML = D.agora.proximas.length
  ? D.agora.proximas.map((p) => `
    <div class="item">
      <div>
        <div class="t">${esc(p.nome)}</div>
        <div class="m"><span>${dataBR(p.prazo)}</span><span>${esc(p.status)}</span>${p.ministerio ? `<span>${esc(p.ministerio)}</span>` : ""}</div>
      </div>
      <span class="tag">${p.faltam === 0 ? "hoje" : "em " + p.faltam + "d"}</span>
    </div>`).join("")
  : '<div class="empty">Nenhum prazo marcado para os próximos 14 dias.</div>';

const atualizado = new Date(D.gerado_em);
$("foot").innerHTML = `Atualizado em <b>${atualizado.toLocaleDateString("pt-BR")} às ${atualizado.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</b>.<br>
Fontes: Banco de Dados de Comunicação, Acompanhamento de Pedidos e Ranking Ministérios (Notion) · Instagram (contagem manual do feed) · YouTube (feed oficial do canal, que cobre os 15 vídeos mais recentes).<br>
Uma demanda conta como entregue pela data de finalização registrada no card — por isso o histórico não muda quando os cards são arquivados.`;

$("months").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-m]");
  if (b) render(b.dataset.m);
});
render(mesAtivo);
</script>
</body>
</html>
